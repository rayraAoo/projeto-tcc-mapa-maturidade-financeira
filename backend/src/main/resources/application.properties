# ---------------------------------------------------------------
# Banco de dados (PostgreSQL local)
# Valores lidos de variáveis de ambiente; o valor depois de ":" é o padrão de desenvolvimento.
# ---------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mapa_financeira}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:senha123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}

# ---------------------------------------------------------------
# Segredos: NÃO escreva chaves neste arquivo. Use variáveis de ambiente.
# ---------------------------------------------------------------
# Chave de assinatura do JWT (mínimo 32 caracteres). Se vazia, é gerada uma chave aleatória a cada execução.
jwt.secret=${JWT_SECRET:}

# Chave da API do Gemini. Se vazia, o diagnóstico usa o texto de contingência (sem IA).
gemini.api.key=${GEMINI_API_KEY:}
# Modelos do Gemini são aposentados com frequência: confira a lista atual e ajuste por variável de ambiente.
gemini.api.model=${GEMINI_MODEL:gemini-3.5-flash}
gemini.api.base-url=https://generativelanguage.googleapis.com/v1beta/models

# Origens do frontend autorizadas (CORS), separadas por vírgula.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
